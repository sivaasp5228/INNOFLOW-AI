services:
  # Web Service (SPA)
  - type: web
    name: innoflow-ai
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun install && serve -s dist
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_SERVICE_ROLE_KEY
        sync: false
